# BC250 Front Controller — ST7789V 240×320 SPI 디스플레이 에디션 (풀옵션)
#
# bc250-front.yaml 의 OLED(SSD1306 I2C)를 ST7789V 2.4인치 240×320 컬러 SPI 디스플레이로
# 교체한 버전. 기존 기능(릴레이 전원 제어·정상 종료·팬 커브·DS18B20·버튼·HA·웹·OTA)은 그대로.
#
# ── 핀맵 (ESP32-S3, 기존 대비 변경분) ─────────────────────────────────────────────
#  GPIO8  SPI MOSI (기존 I2C SDA → SPI로 전환)
#  GPIO9  SPI SCLK (기존 I2C SCL → SPI로 전환)
#  GPIO17 SPI CS
#  GPIO15 SPI DC (data/command)
#  GPIO16 SPI RST
#  GPIO18 BL 백라이트 (PWM 밝기 제어, ledc)
#
# ── 핀맵 (기존 그대로) ─────────────────────────────────────────────────────────────
#  GPIO4  릴레이 IN            GPIO10 팬 PWM 출력 (25kHz)
#  GPIO5  PWR_OK 감지(분압)     GPIO11 팬 타코 입력
#  GPIO6  전원 버튼(GND로)      GPIO12 메뉴 버튼A (다음 항목 / 값 올리기 +)
#  GPIO7  DS18B20 원와이어      GPIO13 메뉴 버튼B (선택·확정)
#  GPIO48 WS2812 상태 LED       GPIO14 메뉴 버튼C (이전 항목 / 값 내리기 −)  ← 2026-08-31 추가
#
# ── 2026-08-31 변경 ──────────────────────────────────────────────────────────────
#  · 5V 투입(콜드 부팅) 때 RST를 눌러야 화면이 나오던 문제: 디스플레이 초기화 전에 LCD RST를
#    1초간 LOW로 잡아 두었다가(전원 안정 대기 겸) 해제 후 200ms 뒤 초기화 (esphome.on_boot + output lcd_rst)
#  · 주의: ESP32-S3 네이티브 USB 포트를 PC(맥)에 꽂아 두면 PC가 포트를 여는 순간 칩이 다운로드 모드로
#    리셋될 수 있음(rst:0x15, boot:0x0 DOWNLOAD) → 화면·WiFi 전부 죽은 것처럼 보임. 펌웨어로 못 막음.
#    평상시엔 PC 케이블을 빼고, 로그가 필요하면 UART(CH343) 포트를 쓸 것.
#  · 전원 버튼 강제 종료: 5초 → 3초 (누르고 있으면 3초 되는 순간 실행, 놓는 타이밍 무관)
#  · 메뉴 버튼 C(GPIO14) 추가: 이전 항목 / 값 내리기. A·C 길게 누르면 0.2초마다 자동 반복
#
# ── ST7789V 모듈 핀 → ESP32-S3 (SPI 4선) ─────────────────────────────────────────
#  모듈 핀      →  ESP32-S3      비고
#  VCC          →  3V3
#  GND          →  GND
#  SDA (DIN)    →  GPIO8         SPI MOSI (데이터 입력)
#  SCL (SCLK)   →  GPIO9         SPI 클럭
#  CS           →  GPIO17
#  DC (A0/RS)   →  GPIO15
#  RST (RESET)  →  GPIO16
#  BL           →  GPIO18         백라이트 PWM 밝기
#
#  ※ 일부 호환 모듈은 240×320 다이(원판)를 240×240으로 잘라 파는 경우가 있음.
#     화면이 세로로 80px 밀려 보이면 offset_height: 80 으로 바꿀 것.

substitutions:
  # BC-250 OS 세팅 후 실제 IP·포트로 교체 (BC-250 쪽 shutdown 에이전트는 OS 설치 때 만듦)
  bc250_shutdown_url: "http://192.168.0.50:8420/shutdown"
  # 릴레이 구동 극성 — 시판 릴레이 모듈(옵토커플러, active-low)이면 "true",
  # 캐리어 PCB(hardware/bc250-front-carrier, NPN 직결 active-high)면 "false"
  relay_inverted: "true"
  # 로그 출력 UART — DevKitC-1(CH343 USB-시리얼)은 UART0,
  # PCBA 보드(hardware/bc250-front-pcba, 네이티브 USB-C)는 USB_SERIAL_JTAG
  log_uart: UART0

esphome:
  name: bc250-front
  friendly_name: BC250 컨트롤러
  # ── 콜드 부팅(5V 투입) 때 LCD가 안 켜지고 RST를 눌러야 나오던 문제 대응 ──
  # ESPHome st7789v 드라이버의 리셋은 1ms LOW → ~4.5ms 대기 → SLPOUT 로 데이터시트 한계(5ms)에
  # 걸쳐 있어, 전원이 막 들어와 LCD 내부 상태가 정리되지 않은 콜드 부팅에서는 초기화가 씹힐 수 있다
  # (RST로 재부팅하면 LCD가 이미 안정된 상태라 정상). 그래서 드라이버 초기화(priority 400) 전에
  # LCD RST(GPIO16)를 1초간 LOW로 잡아 두고(그 사이 LCD·릴레이로 켜진 PSU 전원도 안정) → HIGH →
  # 200ms 뒤에 드라이버가 초기화하도록 한다. 기다리는 동안은 백라이트를 꺼서 백지 화면이 안 보이게 한다.
  # GPIO16은 output.lcd_rst 와 display.reset_pin 이 공유 (둘 다 allow_other_uses: true).
  on_boot:
    - priority: 450          # 디스플레이(400)보다 먼저, 릴레이·출력·number 복원(800)보다 나중
      then:
        - lambda: |-
            id(backlight_pwm).set_level(0.0f);   // 대기 중 백라이트 OFF
            id(lcd_rst).turn_off();               // LCD RST LOW (output 셋업 때부터 이미 LOW)
            delay(1000);                          // 리셋 유지한 채 전원 안정 대기 (블로킹)
            id(lcd_rst).turn_on();                // LCD RST HIGH — 리셋 해제
            delay(200);                           // 데이터시트 리셋 해제 후 대기(120ms) + 여유
    - priority: 350          # 디스플레이 초기화가 끝난 직후: 저장된 밝기로 백라이트 ON
      then:
        - lambda: 'id(backlight_pwm).set_level(id(display_brightness).state / 100.0f);'

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: ${log_uart}   # DevKit=UART0 / PCBA=USB_SERIAL_JTAG (substitutions 참고)
api:            # HA 직결 (자동 발견·이벤트·서비스)
  reboot_timeout: 0s
ota:
  platform: esphome
web_server:
  version: 3

# MQTT가 필요하면 주석 해제
# mqtt:
#   broker: !secret mqtt_broker

wifi:
  reboot_timeout: 0s   # WiFi 끊겨도 재부팅 금지 — 로컬 제어는 계속 동작
  ap:
    ssid: "bc250-front-setup"
captive_portal:
improv_serial:

# ─── SPI 버스 (ST7789V 디스플레이) ─────────────────────────
# ST7789V는 쓰기 전용(MOSI만)이라 miso 불필요.
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO8

one_wire:
  - platform: gpio
    pin: GPIO7

globals:
  - id: shutting_down
    type: bool
    initial_value: "false"

http_request:
  timeout: 5s
  verify_ssl: false

# 정상 종료 시퀀스 — ESP32가 주체. HA 없이도 완결된다.
script:
  - id: graceful_shutdown
    mode: single
    then:
      - globals.set: {id: shutting_down, value: "true"}
      - http_request.post:
          url: ${bc250_shutdown_url}
      - delay: !lambda "return (uint32_t) id(shutdown_wait).state * 1000;"
      - switch.turn_off: server_power
      - globals.set: {id: shutting_down, value: "false"}

  # 메뉴 버튼 A/C 길게 누르기: 0.6초 후부터 0.2초마다 한 칸씩 자동 반복 (놓으면 즉시 중단)
  - id: hold_next
    mode: restart
    then:
      - delay: 600ms
      - while:
          condition: {binary_sensor.is_on: btn_next}
          then:
            - display_menu.down: settings_menu
            - delay: 200ms
  - id: hold_prev
    mode: restart
    then:
      - delay: 600ms
      - while:
          condition: {binary_sensor.is_on: btn_prev}
          then:
            - display_menu.up: settings_menu
            - delay: 200ms

button:
  - platform: template
    name: "정상 종료"
    icon: mdi:power-cycle
    on_press: [script.execute: graceful_shutdown]
  - platform: restart
    id: restart_btn
    name: "컨트롤러 재시작"

# ─── 로컬 설정값 (메뉴·웹·HA 어디서 바꿔도 플래시에 저장) ───
select:
  - platform: template
    id: fan_mode
    name: "팬 모드"
    options: ["자동", "수동"]
    initial_option: "자동"
    restore_value: true
    optimistic: true
  - platform: template
    id: fan_preset
    name: "팬 프리셋"
    options: ["조용히", "표준", "성능"]
    initial_option: "표준"
    restore_value: true
    optimistic: true

number:
  - platform: template
    id: manual_speed
    name: "수동 팬 속도"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
  - platform: template
    id: display_brightness
    name: "화면 밝기"
    min_value: 10
    max_value: 100
    step: 10
    initial_value: 80
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    on_value:
      - lambda: 'id(backlight_pwm).set_level(x / 100.0f);'
  - platform: template
    id: overheat_temp
    name: "과열 경고 온도 C"
    min_value: 70
    max_value: 95
    step: 1
    initial_value: 85
    restore_value: true
    optimistic: true
    unit_of_measurement: "°C"
  - platform: template
    id: shutdown_wait
    name: "종료 대기 시간 s"
    min_value: 30
    max_value: 180
    step: 15
    initial_value: 60
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"

# ─── 전원 제어 ───────────────────────────────
switch:
  - platform: gpio
    id: relay
    pin: GPIO4
    inverted: ${relay_inverted}   # 모듈=true / 캐리어 PCB=false (substitutions 참고)
    restore_mode: RESTORE_DEFAULT_OFF  # 재부팅해도 마지막 전원 상태 유지 (기본=서버 ON)

  - platform: template
    id: server_power
    name: "서버 전원"
    icon: mdi:server
    lambda: 'return !id(relay).state;'
    turn_on_action:  [switch.turn_off: relay]
    turn_off_action: [switch.turn_on: relay]

# ─── 입력 ───────────────────────────────────
binary_sensor:
  - platform: gpio
    id: power_button
    pin: {number: GPIO6, mode: {input: true, pullup: true}, inverted: true}
    on_multi_click:
      # 짧게: 꺼져 있으면 켬 / 켜져 있으면 ESP32가 직접 정상 종료 수행
      - timing: [ON for at most 1s]
        then:
          - if:
              condition: {switch.is_off: server_power}
              then: [switch.turn_on: server_power]
              else: [script.execute: graceful_shutdown]
      # 3초 이상 누르고 있으면 강제 전원 컷 (3초 되는 순간 실행 — 놓는 타이밍 맞출 필요 없음)
      - timing: [ON for at least 3s]
        then: [switch.turn_off: server_power]

  # 메뉴 버튼 3개 (rotary 모드): A=다음 항목/값 올리기(+)  C=이전 항목/값 내리기(−)  B=선택·확정
  # 짧게(≤0.5초) 한 칸, 길게(≥0.6초) 누르고 있으면 0.2초마다 자동 반복. 메뉴가 닫혀 있으면 아무 버튼이나 → 메뉴 열기
  - platform: gpio          # 메뉴 버튼 A: 다음 항목 / 값 올리기(+)
    id: btn_next
    pin: {number: GPIO12, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 20ms]   # 채터링 제거
    on_click:
      min_length: 30ms
      max_length: 500ms
      then:
        - if:
            condition: {display_menu.is_active: settings_menu}
            then: [display_menu.down: settings_menu]
            else: [display_menu.show: settings_menu]
    on_press:
      - if:
          condition: {display_menu.is_active: settings_menu}
          then: [script.execute: hold_next]
    on_release:
      - script.stop: hold_next

  - platform: gpio          # 메뉴 버튼 C (2026-08-31 추가): 이전 항목 / 값 내리기(−)
    id: btn_prev
    pin: {number: GPIO14, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 20ms]
    on_click:
      min_length: 30ms
      max_length: 500ms
      then:
        - if:
            condition: {display_menu.is_active: settings_menu}
            then: [display_menu.up: settings_menu]
            else: [display_menu.show: settings_menu]
    on_press:
      - if:
          condition: {display_menu.is_active: settings_menu}
          then: [script.execute: hold_prev]
    on_release:
      - script.stop: hold_prev

  - platform: gpio          # 메뉴 버튼 B: 선택·확정 (길게 1.2초 = 메뉴 닫기)
    id: btn_sel
    pin: {number: GPIO13, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 20ms]
    on_multi_click:
      - timing: [ON for at most 0.6s]
        then:
          - if:
              condition: {display_menu.is_active: settings_menu}
              then: [display_menu.enter: settings_menu]
              else: [display_menu.show: settings_menu]
      - timing: [ON for at least 1.2s]
        then: [display_menu.hide: settings_menu]

  - platform: gpio
    id: psu_ok
    name: "PSU 실제 켜짐"
    pin: {number: GPIO5, mode: INPUT}   # PWR_OK(회색) 10k+10k 분압
    device_class: power

  - platform: template
    id: fan_error
    name: "팬 이상"
    device_class: problem
    lambda: |-
      return id(psu_ok).state && id(fan_pct).state > 20 && id(fan_rpm).state < 100;
    filters: [delayed_on: 30s]

  - platform: template
    id: overheat
    name: "과열"
    device_class: heat
    lambda: 'return id(gpu_temp).state > id(overheat_temp).state;'

# ─── 센서 ───────────────────────────────────
sensor:
  - platform: dallas_temp
    id: gpu_temp
    name: "GPU 온도"
    address: 0xf200000022dcf928   # 2026-08-28 부팅 로그에서 읽은 실제 주소 (GPU/케이스 구분은 미확인 — 손으로 쥐어 확인, 반대면 아래와 맞바꿀 것)
    update_interval: 5s
  - platform: dallas_temp
    id: case_temp
    name: "케이스 온도"
    address: 0xd4000000c8df1728   # 2026-08-28 부팅 로그에서 읽은 실제 주소
    update_interval: 10s
  - platform: pulse_counter
    id: fan_rpm
    name: "팬 RPM"
    pin: {number: GPIO11, mode: {input: true, pullup: true}}
    unit_of_measurement: RPM
    filters: [multiply: 0.5]      # 2펄스/회전
    update_interval: 5s
  - platform: template
    id: fan_pct
    name: "팬 속도"
    unit_of_measurement: "%"
    lambda: 'return id(the_fan).speed;'
    update_interval: 5s
  - platform: uptime
    id: uptime_s
    name: "컨트롤러 업타임"
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi 신호"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: "IP 주소"

# ─── 팬 ─────────────────────────────────────
output:
  - platform: ledc
    id: fan_pwm_out
    pin: GPIO10
    frequency: 25000 Hz
  - platform: ledc          # 디스플레이 백라이트 PWM
    id: backlight_pwm
    pin: GPIO18
    frequency: 5000 Hz
  - platform: gpio          # LCD RST 직접 제어 — 부팅 때 긴 하드 리셋용 (esphome.on_boot 참고)
    id: lcd_rst
    pin: {number: GPIO16, allow_other_uses: true}   # display.reset_pin 과 공유

fan:
  - platform: speed
    id: the_fan
    name: "쿨링팬"
    output: fan_pwm_out

# 팬 커브: 40→20% 50→35% 60→50% 70→70% 80→100% (선형보간)
# 프리셋: 조용히 −10%p / 표준 0 / 성능 +15%p, 과열 임계값 이상이면 무조건 100%
interval:
  - interval: 5s
    then:
      # 백라이트 밝기를 number 값과 동기화 (부팅 직후 복원값 반영)
      - lambda: 'id(backlight_pwm).set_level(id(display_brightness).state / 100.0f);'
      - lambda: |-
          // fan_mode 옵션: 0=자동, 1=수동 (active_index는 버전 무관하게 동일 API)
          if (id(fan_mode).active_index().value_or(0) == 1) {
            auto call = id(the_fan).turn_on();
            call.set_speed((int) id(manual_speed).state);
            call.perform();
            return;
          }
          float t = id(gpu_temp).state;
          if (isnan(t)) return;
          float pct;
          if      (t >= id(overheat_temp).state) pct = 100;
          else if (t >= 80) pct = 100;
          else if (t >= 70) pct = 70  + (t-70)*3.0;
          else if (t >= 60) pct = 50  + (t-60)*2.0;
          else if (t >= 50) pct = 35  + (t-50)*1.5;
          else if (t >= 40) pct = 20  + (t-40)*1.5;
          else              pct = 20;
          // fan_preset 옵션: 0=조용히, 1=표준, 2=성능
          auto preset_idx = id(fan_preset).active_index().value_or(1);
          if (preset_idx == 0)      pct -= 10;
          else if (preset_idx == 2) pct += 15;
          if (pct < 10)  pct = 10;
          if (pct > 100) pct = 100;
          auto call = id(the_fan).turn_on();
          call.set_speed((int)pct);
          call.perform();
      # 상태 LED: 꺼짐=OFF / 종료중=노랑 / 이상=빨강 / 정상=초록
      - lambda: |-
          auto call = id(status_led).turn_on();
          if (!id(server_power).state) { id(status_led).turn_off().perform(); return; }
          if (id(shutting_down)) call.set_rgb(1.0, 0.7, 0.0);
          else if (id(fan_error).state || id(overheat).state) call.set_rgb(1.0, 0.0, 0.0);
          else call.set_rgb(0.0, 1.0, 0.0);
          call.set_brightness(0.4);
          call.perform();
  - interval: 7s
    then:
      - if:
          condition: {display_menu.is_active: settings_menu}
          then: []   # 메뉴 사용 중엔 화면 자동 순환 정지
          else:
            - display.page.show_next: lcd
            - component.update: lcd

# ─── 상태 LED ────────────────────────────────
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "상태 LED"
    pin: GPIO48
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB

# ─── 폰트 (240×320 화면에 맞춘 크기) ─────────
font:
  - file: "gfonts://Roboto@700"     # 대형 온도 표시
    id: f_48
    size: 48
    glyphs: '0123456789.-°C'
