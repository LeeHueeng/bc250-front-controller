# BC250 Front Controller — ST7789V 240×320 SPI 디스플레이 에디션 (풀옵션)
#
# bc250-front.yaml 의 OLED(SSD1306 I2C)를 ST7789V 2.4인치 240×320 컬러 SPI 디스플레이로
# 교체한 버전. 기존 기능(릴레이 전원 제어·정상 종료·팬 커브·DS18B20·버튼·HA·웹·OTA)은 그대로.
#
# ── 핀맵 (ESP32-S3, 기존 대비 변경분) ─────────────────────────────────────────────
#  GPIO8  SPI MOSI (기존 I2C SDA → SPI로 전환)
#  GPIO9  SPI SCLK (기존 I2C SCL → SPI로 전환)
#  GPIO17 SPI CS
#  GPIO15 SPI DC (data/command)
#  GPIO16 SPI RST
#  GPIO18 BL 백라이트 (PWM 밝기 제어, ledc)
#
# ── 핀맵 (기존 그대로) ─────────────────────────────────────────────────────────────
#  GPIO4  릴레이 IN            GPIO10 팬 PWM 출력 (25kHz)
#  GPIO5  PWR_OK 감지(분압)     GPIO11 팬 타코 입력
#  GPIO6  전원 버튼(GND로)      GPIO12 메뉴 버튼A (다음 화면 / 다음 항목 / 값 올리기 +)
#  GPIO7  DS18B20 원와이어      GPIO13 메뉴 버튼B (선택·확정)
#  GPIO48 WS2812 상태 LED       GPIO14 메뉴 버튼C (이전 화면 / 이전 항목 / 값 내리기 −)  ← 2026-08-31 추가
#
# ── 2026-08-31 변경 ──────────────────────────────────────────────────────────────
#  · 5V 투입(콜드 부팅) 때 RST를 눌러야 화면이 나오던 문제: 디스플레이 초기화 전에 LCD RST를
#    1초간 LOW로 잡아 두었다가(전원 안정 대기 겸) 해제 후 200ms 뒤 초기화 (esphome.on_boot + output lcd_rst)
#  · 주의: ESP32-S3 네이티브 USB 포트를 PC(맥)에 꽂아 두면 PC가 포트를 여는 순간 칩이 다운로드 모드로
#    리셋될 수 있음(rst:0x15, boot:0x0 DOWNLOAD) → 화면·WiFi 전부 죽은 것처럼 보임. 펌웨어로 못 막음.
#    평상시엔 PC 케이블을 빼고, 로그가 필요하면 UART(CH343) 포트를 쓸 것.
#  · 전원 버튼 강제 종료: 5초 → 3초 (누르고 있으면 3초 되는 순간 실행, 놓는 타이밍 무관)
#  · 메뉴 버튼 C(GPIO14) 추가: 이전 항목 / 값 내리기. A·C 길게 누르면 0.2초마다 자동 반복
#  · 보안: API 암호화 키·OTA 비밀번호·웹 로그인 → secrets.yaml (secrets.yaml.example 참고, git 미포함)
#  · 과열 위험(경고 온도 +10°C 가 60초 지속) → 자동 정상 종료, 실패하면 강제 전원 컷
#  · 백라이트 자동 어둡게: 서버 꺼짐 / 밤 시간(SNTP 시계 맞을 때만). 버튼 누르면 30초간 원래 밝기
#  · 컨트롤러 초기화: 설정값만 초기화(WiFi 유지) / 공장 초기화(WiFi·설정 전부 지우고 재부팅) — 메뉴·웹·HA
#
# ── 2026-09-01 변경 ──────────────────────────────────────────────────────────────
#  · 화면 깨짐 자동 복구(script lcd_heal): LCD 컨트롤러의 핵심 레지스터(절전 해제·표시 모드·색 반전·주소 방향·
#    픽셀 포맷·표시 ON)를 다시 써 주고 프레임을 다시 그린다. 버튼 조작 1초 뒤 · 60초마다 · 부팅 10/30초 뒤 자동.
#    정상일 땐 아무 변화 없음. 노이즈로 명령 한 바이트가 잘못 들어가 색 반전·밀림·백지·꺼짐이 된 화면을 되살린다.
#    (전체 프레임을 매번 다시 쓰는 드라이버라 픽셀 데이터 오류는 원래 다음 프레임에 지워지지만, 명령 레지스터가
#     바뀌면 영구히 깨진 채 남았음 → 이 복구가 그걸 메꾼다)
#  · 화면 하드 복구(script lcd_reset): RST 핀으로 LCD를 완전히 리셋하고 초기화 시퀀스 전체를 다시 보냄 —
#    메뉴 "화면 복구" / 웹·HA "화면 복구" 버튼. 약 0.4초 화면이 꺼졌다 켜진다.
#    → 이를 위해 GPIO15(DC)도 output.lcd_dc 로 공유(allow_other_uses), GPIO16(RST)은 이미 공유 중.
#  · 화면 갱신 1초 → 2초: 한 프레임(240×320×16bit=153KB) 쓰는 데 약 140ms 동안 메인 루프가 멈춰(버튼 반응
#    지연·짧은 누름이 길게 잡히는 원인) 절반으로 줄임. 값들은 어차피 5초마다 갱신. 버튼 조작은 즉시 갱신.
#  · SPI 클럭 substitutions lcd_data_rate 로 노출(기본 20MHz). 점퍼선이 길어 계속 깨지면 10MHz 로 낮춰 볼 것.
#  · 전원 투입 자동 부팅: 릴레이 restore_mode 를 ALWAYS_OFF(=서버 ON)로 바꾸고, 서버 꺼짐 상태 복원은
#    "소프트 재부팅(OTA·재시작 버튼·안전 모드)일 때만" on_boot(700)에서 직접 한다(globals server_was_off).
#    → 5VSB/AC를 뽑았다 꽂으면(콜드 부팅, rst POWERON) 마지막 상태가 꺼짐이었어도 서버가 자동으로 켜진다.
#    예전엔 RESTORE_DEFAULT_OFF 라서 "끈 채로 뽑았다 꽂으면 꺼진 채" 였음. substitutions power_on_boot 로 끔.
#
# ── 2026-09-01 (2차) 개선 ────────────────────────────────────────────────────────
#  · 종료 요청 실패가 "유지"됨: shutdown_failed 전역 → LED 빨강 + 화면 하단 "SHUTDOWN REQUEST FAILED / HOLD POWER 3S"
#    가 다음 전원 조작까지 남는다 (예전엔 5초 interval 이 LED 를 초록으로 덮어써 실패를 알 수 없었음)
#  · 종료 진행 표시: 하단 바 "SENDING SHUTDOWN" → "SHUTTING DOWN 43s" 카운트다운(shutdown_deadline). 대기가 끝났는데
#    에이전트(/health)가 아직 응답하면 OS 가 안 꺼진 것 → 한 번 더 기다린 뒤 컷 (최대 2배)
#  · 강제 컷/웹 OFF 가 종료 대기 중이면 스크립트를 끊는다 (turn_off_action 에서 script.stop)
#  · 과열 위험(overheat_critical)이 안 풀렸으면 전원 켜기 거부 (turn_on_action)
#  · "PSU 이상" 센서: 릴레이 ON 인데 PWR_OK 가 10초 넘게 안 오면 → 빨강 + 하단 "PSU NOT OK". 하단 아이콘 FAN/TEMP/PSU/NET
#  · HA 노출: "종료 진행 중", "종료 실패", "PSU 이상" binary_sensor
#  · BC250 종료 에이전트 동봉(bc250-agent/): POST /shutdown (X-Token 헤더) · GET /health. 가이드 11장. 토큰은 secrets.yaml
#    bc250_agent_token. 주소는 substitutions bc250_host / bc250_agent_port (예전 192.168.0.50 은 다른 서브넷이라 항상 실패했음)
#  · http_request timeout 5s → 3s (에이전트가 없을 때 화면·버튼이 멈추는 시간)
#  · 설정용 AP 에 비밀번호(secrets ap_password) — 예전엔 누구나 붙어서 캡티브 포털로 WiFi 를 바꿀 수 있었음
#  · 웹 대시보드 인증 basic → digest (ESPHome 2027.1 기본값 선반영, LAN 에 비밀번호 평문 안 흐름)
#  · 화면 밝기를 웹/HA 에서 바꿔도 30초 동안 자동 어둡게가 덮어쓰지 않음 (on_value 에서 last_input 갱신)
#  · 네트워크 화면: 오프라인이면 설정 AP 이름·192.168.4.1 안내. 팬은 속도가 바뀔 때만 HA 로 전송
#  · (남김) 부팅 로그의 [W][ledc.output] Not yet initialized — 밝기 number 복원이 ledc 초기화보다 먼저라 나는 무해한 경고
#  · PSU 실제 켜짐(GPIO5): 디지털 입력 → ADC 전압 판정으로 교체. 10k+10k 분압 2.5V 는 ESP32-S3 VIH(2.475V) 경계라
#    디지털로는 애매하고, 선이 안 물려 떠 있어도 ON 으로 읽힐 수 있었음. 이제 1.5V 넘으면 ON, 1.0V 아래면 OFF (히스테리시스),
#    실제 전압은 센서 "PWR_OK 전압"으로 웹/HA 에 보임 → 배선 확인용. 분압 저항은 그대로.
#  · 팬 표시: 서버(=PSU 12V)가 꺼져 있으면 팬 엔티티를 OFF 로 두고 화면에 "OFF / NO 12V" — 예전엔 PWM 명령값(20%)을
#    그대로 보여줘 안 도는 팬이 도는 것처럼 보였음. "팬 속도" 센서도 팬 OFF 면 0. 서버 켜짐인데 RPM 0 이면(팬 이상) 빨강.
#
# ── 2026-09-07 ──────────────────────────────────────────────────────────────────
#  · "컨트롤러 칩 온도" 센서(internal_temperature): ESP32-S3 내부 온도를 웹/HA 에 노출. 기판이 뜨끈할 때 정상 범위인지
#    숫자로 확인용 — WiFi 절전 OFF·240MHz 상시라 실내에서 45~65°C 는 정상, 80°C 넘으면 통풍·전원 확인.
#  · (기록) 9/7 보드에 HA 쪽 ESPHome 2025.2.2 로 빌드한 8/31 커밋본이 올라가 있었음 → 화면 1초 갱신(루프 30% 블로킹)·
#    GPIO5 디지털 입력 튐(분당 70회)·다른 API/OTA 비밀번호. 이 파일은 2026.8 문법(request_headers·digest)이라 반드시
#    이 저장소의 secrets.yaml 과 ESPHome 2026.8+ 로 빌드해 올릴 것 (USB: esphome upload … --device /dev/cu.usbmodem5C630586901).
#  · 버그 수정: "서버 전원" 템플릿 스위치가 부팅 때 저장된 OFF 를 복원(turn_off_action)하며 릴레이를 켜서, 콜드 부팅
#    자동 ON 정책이 안 먹었음(9/1 검증 땐 저장값이 ON 이라 드러나지 않음). restore_mode: DISABLED 로 해결.
#  · 소프트 재부팅(OTA·재시작) 뒤 화면이 안 켜지고 RST 를 눌러야 나온다는 보고 → 소프트 재부팅이면 부팅 3초 뒤
#    lcd_reset(하드 복구)을 자동 실행(script lcd_reset_boot). 서버 꺼짐 때 백라이트 10%→35% (밝은 방에서 꺼진 듯 보임).
#  · 콜드 부팅(USB/5V 투입) 첫 부팅에선 LCD 가 안 나오고 RST 로만 살아나는 현상(하드 복구·BOOT 버튼 무효, 소프트 재부팅은 유효)
#    → on_boot 900 에서 POWERON 이면 esp_restart() 1회 (bc250_boot.h 의 RTC 플래그로 2차 부팅도 콜드 취급 → 서버 ON 정책 유지).
#  · 팬 PWM(25kHz)·백라이트 PWM(5kHz)이 LEDC 타이머 0 을 공유해 팬이 5kHz 로 돌던 버그 → 백라이트를 채널 2(타이머 1)로.
#
# ── ST7789V 모듈 핀 → ESP32-S3 (SPI 4선) ─────────────────────────────────────────
#  모듈 핀      →  ESP32-S3      비고
#  VCC          →  3V3
#  GND          →  GND
#  SDA (DIN)    →  GPIO8         SPI MOSI (데이터 입력)
#  SCL (SCLK)   →  GPIO9         SPI 클럭
#  CS           →  GPIO17
#  DC (A0/RS)   →  GPIO15
#  RST (RESET)  →  GPIO16
#  BL           →  GPIO18         백라이트 PWM 밝기
#
#  ※ 일부 호환 모듈은 240×320 다이(원판)를 240×240으로 잘라 파는 경우가 있음.
#     화면이 세로로 80px 밀려 보이면 offset_height: 80 으로 바꿀 것.

substitutions:
  # BC250 의 IP·에이전트 포트 — 컨트롤러와 같은 서브넷이어야 함 (2026-09-01 로그: 컨트롤러 192.168.1.15).
  # 공유기에서 BC250 에 고정 IP(DHCP 예약)를 주고 여기 적을 것. 에이전트(bc250-agent/) 설치는 가이드 11장.
  # 토큰은 secrets.yaml 의 bc250_agent_token — BC250 의 /etc/bc250-agent.env 와 같아야 한다.
  bc250_host: "192.168.1.50"
  bc250_agent_port: "8420"
  # 릴레이 구동 극성 — 시판 릴레이 모듈(옵토커플러, active-low)이면 "true",
  # 캐리어 PCB(hardware/bc250-front-carrier, NPN 직결 active-high)면 "false"
  relay_inverted: "true"
  # 로그 출력 UART — DevKitC-1(CH343 USB-시리얼)은 UART0,
  # PCBA 보드(hardware/bc250-front-pcba, 네이티브 USB-C)는 USB_SERIAL_JTAG
  log_uart: UART0
  # 백라이트 자동 어둡게 — 아래 interval 의 백라이트 람다에서 사용
  off_brightness: "35"      # 서버 꺼져 있을 때 밝기 % (2026-09-07 10→35: 10% 는 밝은 방에서 꺼진 것처럼 보임)
  night_start: "23"         # 밤 시작 시(時) — 이 시각 이후
  night_end: "7"            # 밤 끝 시(時) — 이 시각 전까지
  night_brightness: "30"    # 밤 밝기 %
  # 과열 위험 마진 — 과열 경고 온도 + 이 값(°C) 이 60초 지속되면 자동 정상 종료
  critical_margin: "10"
  # 전원 투입(콜드 부팅) 때 서버 자동 ON — "false"면 예전처럼 마지막 전원 상태 복원(끈 채로 뽑았다 꽂으면 꺼진 채)
  power_on_boot: "true"
  # LCD SPI 클럭 — 점퍼선이 길어 화면이 계속 깨지면 10MHz 로 낮춰 볼 것 (한 프레임 쓰는 시간은 2배)
  lcd_data_rate: "20MHz"

esphome:
  name: bc250-front
  friendly_name: BC250 컨트롤러
  includes: ["<esp_system.h>", "bc250_boot.h"]   # esp_reset_reason() + 콜드 부팅 자동 재부팅 플래그(bc250_is_cold_boot, on_boot 900/700)
  # ── 콜드 부팅(5V 투입) 때 LCD가 안 켜지고 RST를 눌러야 나오던 문제 대응 ──
  # ESPHome st7789v 드라이버의 리셋은 1ms LOW → ~4.5ms 대기 → SLPOUT 로 데이터시트 한계(5ms)에
  # 걸쳐 있어, 전원이 막 들어와 LCD 내부 상태가 정리되지 않은 콜드 부팅에서는 초기화가 씹힐 수 있다
  # (RST로 재부팅하면 LCD가 이미 안정된 상태라 정상). 그래서 드라이버 초기화(priority 400) 전에
  # LCD RST(GPIO16)를 1초간 LOW로 잡아 두고(그 사이 LCD·릴레이로 켜진 PSU 전원도 안정) → HIGH →
  # 200ms 뒤에 드라이버가 초기화하도록 한다. 기다리는 동안은 백라이트를 꺼서 백지 화면이 안 보이게 한다.
  # GPIO16은 output.lcd_rst 와 display.reset_pin 이 공유 (둘 다 allow_other_uses: true).
  on_boot:
    # ── 전원 정책 (2026-09-01) ── 릴레이는 ALWAYS_OFF(=서버 ON)로 셋업(800)됨. 소프트 재부팅(OTA·재시작 버튼·
    # 안전 모드·워치독)이고 마지막 상태가 "서버 꺼짐"이면 여기서 다시 끈다. 콜드 부팅(5VSB/AC 투입, RST 버튼도
    # 포함 — 둘 다 rst POWERON)은 마지막 상태와 무관하게 서버 ON = 전원 투입 자동 부팅. power_on_boot 로 끌 수 있음.
    # ── 콜드 부팅 자동 재부팅 (2026-09-07) ── 전원 투입/RST 직후 첫 부팅에서는 LCD 가 안 나오고(재초기화·하드 복구로도
    # 안 됨) 칩 리셋으로만 살아나는데, 소프트 재부팅으로도 살아남을 실측 → 펌웨어가 RST 를 대신 누른다. 900 = 출력 핀
    # 셋업(1000) 직후·WiFi/디스플레이 전, safe_mode 카운터(AFTER_WIFI)보다 앞이라 부트루프 카운트에 안 잡힌다.
    # 2차 부팅은 리셋 원인이 SW 지만 RTC 플래그로 콜드 부팅 취급 (bc250_boot.h). 릴레이는 GPIO 상태가 유지돼 깜빡이지 않는다.
    - priority: 900
      then:
        - lambda: |-
            if (esp_reset_reason() == ESP_RST_POWERON) {
              ESP_LOGI("main", "콜드 부팅 — LCD 정상화를 위해 1회 자동 재부팅 (리셋 원인=%d)", (int) esp_reset_reason());
              bc250_cold_flag = BC250_COLD_MAGIC;
              delay(50);
              esp_restart();
            }
    - priority: 700          # 릴레이(800)·globals 복원(800)·server_power(798) 셋업 직후
      then:
        - if:
            condition:
              lambda: 'return id(server_was_off) && (!${power_on_boot} || !bc250_is_cold_boot());'   # 2026-09-07: 자동 재부팅 2차 부팅도 콜드 취급
            then:
              - logger.log: {level: INFO, format: "소프트 재부팅 — 서버 꺼짐 상태 복원 (릴레이 ON)"}
              - switch.turn_on: relay
            else:
              - logger.log: {level: INFO, format: "부팅 — 서버 ON (전원 투입 자동 부팅=${power_on_boot}, 리셋 원인=%d, 콜드=%d)", args: ['(int) esp_reset_reason()', '(int) bc250_is_cold_boot()']}
    - priority: 450          # 디스플레이(400)보다 먼저, 릴레이·출력·number 복원(800)보다 나중
      then:
        - lambda: |-
            id(backlight_pwm).set_level(0.0f);   // 대기 중 백라이트 OFF
            id(lcd_rst).turn_off();               // LCD RST LOW (output 셋업 때부터 이미 LOW)
            delay(1000);                          // 리셋 유지한 채 전원 안정 대기 (블로킹)
            id(lcd_rst).turn_on();                // LCD RST HIGH — 리셋 해제
            delay(200);                           // 데이터시트 리셋 해제 후 대기(120ms) + 여유
    - priority: 350          # 디스플레이 초기화가 끝난 직후: 저장된 밝기로 백라이트 ON
      then:
        - lambda: 'id(backlight_pwm).set_level(id(display_brightness).state / 100.0f);'
    - priority: -100         # 전부 켜진 뒤(WiFi 시작 이후): 10초·30초 뒤 LCD 소프트 복구 — WiFi 기동 전류로 LCD가
      then:                  # 흔들렸어도 되살림 (콜드 부팅 때 화면 안 켜지는 증상의 2차 방어선, 2026-09-01)
        # 소프트 재부팅(OTA·재시작 버튼·안전 모드)이면 3초 뒤 LCD 하드 복구(RST 펄스 + 전체 초기화) — 2026-09-07:
        # RST(콜드 부팅)에선 화면이 켜지는데 OTA 재부팅 뒤엔 안 켜진다는 보고. 소프트 재부팅은 GPIO·패널이 이전 상태를
        # 유지한 채 재초기화되므로 드라이버 초기화가 씹힐 수 있어, 켜져 있던 것과 무관하게 한 번 더 완전히 초기화한다.
        - if:
            condition: {lambda: 'return esp_reset_reason() != ESP_RST_POWERON;'}   # 콜드 부팅의 2차 부팅(SW)도 포함 — 실측상 이 조합이 화면을 살림
            then: [script.execute: lcd_reset_boot]
        - script.execute: lcd_heal_boot
        - lambda: 'bc250_cold_flag = 0;'   # 콜드 플래그 소비 — 이후 OTA·재시작(SW)은 소프트 재부팅으로 판정

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: ${log_uart}   # DevKit=UART0 / PCBA=USB_SERIAL_JTAG (substitutions 참고)
api:            # HA 직결 (자동 발견·이벤트·서비스)
  reboot_timeout: 0s
  encryption:
    key: !secret api_key          # HA에서 기기 추가할 때 입력 (secrets.yaml)
ota:
  platform: esphome
  password: !secret ota_password  # WiFi OTA 업로드 비밀번호 (esphome upload 가 자동으로 사용)
web_server:
  version: 3
  local: true     # 대시보드 JS/CSS를 펌웨어에 내장 — 인터넷 없는 AP 모드에서도 페이지가 깨지지 않음
  auth:
    type: digest    # 2026-09-01: basic → digest (비밀번호가 LAN 에 평문으로 안 흐름. 브라우저 로그인창은 동일)
    username: admin
    password: !secret web_password   # 웹 대시보드 로그인

# MQTT가 필요하면 주석 해제
# mqtt:
#   broker: !secret mqtt_broker

wifi:
  reboot_timeout: 0s   # WiFi 끊겨도 재부팅 금지 — 로컬 제어는 계속 동작
  power_save_mode: none   # 상시 전원이라 절전 불필요 — 웹/HA 응답 지연 방지
  ap:
    ssid: "bc250-front-setup"
    password: !secret ap_password   # 2026-09-01: 설정용 AP 도 잠금 — 없으면 누구나 붙어서 캡티브 포털로 WiFi 를 바꿀 수 있음
captive_portal:
improv_serial:

time:
  - platform: sntp          # 밤 시간 백라이트 판정용 — 인터넷 안 되면 그냥 밤 판정을 건너뜀
    id: sntp_time
    timezone: Asia/Seoul

# ─── SPI 버스 (ST7789V 디스플레이) ─────────────────────────
# ST7789V는 쓰기 전용(MOSI만)이라 miso 불필요.
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO8

one_wire:
  - platform: gpio
    pin: GPIO7

globals:
  - id: shutting_down
    type: bool
    initial_value: "false"
  - id: shutdown_http_ok        # 직전 HTTP 요청(종료 요청 / 대기 뒤 health)이 2xx로 성공했는지
    type: bool
    initial_value: "false"
  - id: shutdown_failed         # 마지막 정상 종료 요청이 실패했는지 — LED·화면에 다음 전원 조작까지 유지 (2026-09-01)
    type: bool
    initial_value: "false"
  - id: shutdown_deadline       # 종료 대기 끝나는 시각(millis). 0 = 요청 보내는 중 (화면 카운트다운용)
    type: uint32_t
    initial_value: "0"
  - id: last_input              # 마지막 버튼 조작 시각(millis) — 백라이트 자동 어둡게 해제용
    type: uint32_t
    initial_value: "0"
  - id: server_was_off          # 사용자가 마지막으로 서버를 껐는지(true=꺼짐) — 플래시 저장, 소프트 재부팅 뒤 복원용
    type: bool                  # (server_power 의 turn_on/off_action 에서만 갱신. on_boot 700 참고)
    restore_value: true
    initial_value: "false"

http_request:
  timeout: 3s       # 2026-09-01 5s→3s: ESP-IDF 에선 요청이 메인 루프를 동기로 막아, 에이전트가 없으면 이 시간만큼 화면·버튼이 멈춤
  verify_ssl: false

# 정상 종료 시퀀스 — ESP32가 주체. HA 없이도 완결된다.  (2026-08-31 작성, 2026-09-01 개선)
# 1) 화면 하단 "SENDING SHUTDOWN" → BC250 에이전트(bc250-agent/)에 HTTP POST /shutdown (X-Token 헤더, 최대 3초 동기 블로킹)
# 2) 2xx 이면 종료 대기 시간만큼 카운트다운("SHUTTING DOWN 43s") → 대기 끝에 GET /health 를 한 번 찔러 아직 응답하면
#    OS 가 안 꺼진 것이므로 한 번 더 기다림(최대 2배) → 전원 컷 (turn_off_action 이 이 스크립트를 멈추고 상태를 정리)
# 3) 요청 실패(에이전트 없음·네트워크 불통·토큰 불일치 403·오류 응답)면 살아있는 OS 전원을 끊지 않고 유지 + LED·화면 빨강을
#    다음 전원 조작까지 유지(shutdown_failed) — 그래도 꺼야 하면 전원 버튼 3초(강제 컷). 이미 꺼져 있으면 아무것도 하지 않는다.
script:
  - id: graceful_shutdown
    mode: single
    then:
      - if:
          condition: {switch.is_on: server_power}
          then:
            - globals.set: {id: shutting_down, value: "true"}
            - globals.set: {id: shutdown_failed, value: "false"}
            - globals.set: {id: shutdown_http_ok, value: "false"}
            - globals.set: {id: shutdown_deadline, value: "0"}
            - component.update: lcd           # "SENDING SHUTDOWN" — 아래 POST 가 끝날 때까지(최대 3초) 화면·버튼 멈춤
            - http_request.post:
                url: "http://${bc250_host}:${bc250_agent_port}/shutdown"
                request_headers: {X-Token: !secret bc250_agent_token}
                on_response:
                  then:
                    - lambda: 'id(shutdown_http_ok) = response->status_code >= 200 && response->status_code < 300;'
                    - if:
                        condition: {lambda: 'return !id(shutdown_http_ok);'}
                        then: [logger.log: {level: WARN, format: "종료 요청 거부됨: HTTP %d (403 이면 토큰 불일치)", args: ['response->status_code']}]
                on_error:
                  then:
                    - logger.log: {level: WARN, format: "종료 요청 연결 실패: http://${bc250_host}:${bc250_agent_port}/shutdown (에이전트·IP·방화벽 확인)"}
            - if:
                condition: {lambda: 'return id(shutdown_http_ok);'}
                then:
                  - lambda: 'id(shutdown_deadline) = millis() + (uint32_t) id(shutdown_wait).state * 1000;'
                  - component.update: lcd
                  - delay: !lambda "return (uint32_t) id(shutdown_wait).state * 1000;"
                  # 대기 끝 — 에이전트가 아직 살아 있으면 OS 가 안 꺼진 것. 한 번만 더 기다린다 (그래도 안 꺼지면 컷)
                  - globals.set: {id: shutdown_http_ok, value: "false"}
                  - http_request.get:
                      url: "http://${bc250_host}:${bc250_agent_port}/health"
                      on_response:
                        then: [lambda: 'id(shutdown_http_ok) = response->status_code >= 200 && response->status_code < 300;']
                      on_error:
                        then: [logger.log: {level: DEBUG, format: "OS 응답 없음 — 종료된 것으로 판단"}]
                  - if:
                      condition: {lambda: 'return id(shutdown_http_ok);'}
                      then:
                        - logger.log: {level: WARN, format: "종료 대기 %.0f초가 지났는데 OS 가 아직 응답 — 한 번 더 기다림", args: ['id(shutdown_wait).state']}
                        - lambda: 'id(shutdown_deadline) = millis() + (uint32_t) id(shutdown_wait).state * 1000;'
                        - component.update: lcd
                        - delay: !lambda "return (uint32_t) id(shutdown_wait).state * 1000;"
                  - switch.turn_off: server_power   # → turn_off_action 이 이 스크립트를 멈추고 shutting_down 도 내린다
                else:
                  - logger.log: {level: WARN, format: "종료 요청 실패 — 전원 유지 (강제 종료는 전원 버튼 3초)"}
                  - globals.set: {id: shutdown_failed, value: "true"}
                  - globals.set: {id: shutting_down, value: "false"}
                  - component.update: lcd
                  - light.turn_on: {id: status_led, red: 100%, green: 0%, blue: 0%, brightness: 40%}
            - globals.set: {id: shutting_down, value: "false"}

  # 설정값만 초기화 — 팬·밝기·과열·종료대기를 기본값으로. WiFi·전원 상태는 건드리지 않음
  - id: reset_settings
    mode: single
    then:
      - lambda: |-
          { auto c = id(fan_mode).make_call();    c.set_option("자동"); c.perform(); }
          { auto c = id(fan_preset).make_call();  c.set_option("표준"); c.perform(); }
          { auto c = id(manual_speed).make_call();      c.set_value(50);  c.perform(); }
          { auto c = id(display_brightness).make_call(); c.set_value(80);  c.perform(); }
          { auto c = id(overheat_temp).make_call();      c.set_value(85);  c.perform(); }
          { auto c = id(shutdown_wait).make_call();      c.set_value(60);  c.perform(); }
      - logger.log: "설정값 초기화 완료 (WiFi 유지)"

  # 메뉴 버튼 A/C 길게 누르기: 0.6초 후부터 0.2초마다 한 칸씩 자동 반복 (놓으면 즉시 중단)
  - id: hold_next
    mode: restart
    then:
      - delay: 600ms
      - while:
          condition: {binary_sensor.is_on: btn_next}
          then:
            - display_menu.down: settings_menu
            - delay: 200ms
  - id: hold_prev
    mode: restart
    then:
      - delay: 600ms
      - while:
          condition: {binary_sensor.is_on: btn_prev}
          then:
            - display_menu.up: settings_menu
            - delay: 200ms
  # 과열 위험: 정상 종료를 시도하고, 그래도 켜져 있으면(종료 요청 실패) 강제 전원 컷
  - id: overheat_shutdown
    mode: single
    then:
      - logger.log: {level: ERROR, format: "과열 위험: GPU %.1f°C — 자동 정상 종료 시도", args: ['id(gpu_temp).state']}
      - script.execute: graceful_shutdown
      - script.wait: graceful_shutdown
      - if:
          condition: {switch.is_on: server_power}
          then:
            - logger.log: {level: ERROR, format: "과열 위험: 정상 종료 실패 — 강제 전원 컷"}
            - switch.turn_off: server_power
  # 메뉴 열린 채 30초 동안 버튼 조작이 없으면 자동으로 닫기 (화면 자동 순환 복귀)
  - id: menu_timeout
    mode: restart
    then:
      - delay: 30s
      - display_menu.hide: settings_menu

  # ── LCD 복구 (2026-09-01) ─────────────────────────────────────────────────────
  # 소프트 복구: 컨트롤러 레지스터 중 노이즈로 뒤집히면 화면이 "영구히" 깨지는 것들(절전·아이들·부분표시·주소 방향·
  # 픽셀 포맷·색 반전·표시 ON/OFF)을 드라이버 초기값으로 다시 쓰고 프레임을 다시 그린다. 정상일 땐 변화 없음.
  # 화면 데이터(RAM)는 어차피 2초마다 전체를 다시 쓰므로 픽셀 오류는 여기서 신경 안 씀.
  # 명령/데이터는 st7789v 드라이버와 같은 SPI 장치(id lcd)의 공개 API + DC 핀 공유 출력(lcd_dc)으로 보낸다.
  - id: lcd_heal
    mode: single
    then:
      - lambda: |-
          auto cmd = [](uint8_t c) { id(lcd_dc).turn_off(); id(lcd).enable(); id(lcd).write_byte(c); id(lcd).disable(); id(lcd_dc).turn_on(); };
          auto dat = [](std::initializer_list<uint8_t> v) { id(lcd_dc).turn_on(); id(lcd).enable(); for (uint8_t b : v) id(lcd).write_byte(b); id(lcd).disable(); };
          cmd(0x11); delay(10);      // SLPOUT  절전 해제 (이미 깨어 있으면 무시)
          cmd(0x38);                 // IDMOFF  아이들(8색) 모드 해제
          cmd(0x13);                 // NORON   일반 표시 모드 (부분 표시 해제)
          cmd(0x36); dat({0x08});    // MADCTL  주소 방향 + BGR (드라이버 초기값과 동일)
          cmd(0x3A); dat({0x55});    // COLMOD  16비트 RGB565
          cmd(0x21);                 // INVON   색 반전 (이 패널은 반전이 정상 색)
          cmd(0x29);                 // DISPON  표시 ON
      - component.update: lcd      # 프레임 다시 쓰기 (RAM까지 깨졌을 때 대비)
  # 버튼 조작 뒤 1초 지나면 소프트 복구 (연타는 마지막 조작 기준으로 한 번만)
  - id: lcd_heal_after_input
    mode: restart
    then:
      - delay: 1s
      - script.execute: lcd_heal
  # 부팅 10초·30초 뒤 소프트 복구 (WiFi 기동 전류 등으로 초기화 직후 LCD가 흔들린 경우)
  # 소프트 재부팅 3초 뒤 하드 복구 (esphome.on_boot -100 참고, 2026-09-07)
  - id: lcd_reset_boot
    mode: single
    then:
      - delay: 3s
      - logger.log: {level: INFO, format: "소프트 재부팅 — LCD 하드 복구 실행 (리셋 원인=%d)", args: ['(int) esp_reset_reason()']}
      - script.execute: lcd_reset
  - id: lcd_heal_boot
    mode: single
    then:
      - delay: 10s
      - script.execute: lcd_heal
      - delay: 20s
      - script.execute: lcd_heal
  # 하드 복구: 백라이트 끄고 → RST 핀으로 LCD 완전 리셋 → 드라이버(st7789v.cpp)와 동일한 초기화 시퀀스 전체 →
  # 프레임 쓰기 → 표시 ON → 백라이트 복귀. 소프트 복구로도 안 돌아올 때(컨트롤러 먹통). 약 0.4초 꺼졌다 켜짐.
  - id: lcd_reset
    mode: single
    then:
      - logger.log: {level: INFO, format: "LCD 하드 복구 시작"}
      - lambda: |-
          auto cmd = [](uint8_t c) { id(lcd_dc).turn_off(); id(lcd).enable(); id(lcd).write_byte(c); id(lcd).disable(); id(lcd_dc).turn_on(); };
          auto dat = [](std::initializer_list<uint8_t> v) { id(lcd_dc).turn_on(); id(lcd).enable(); for (uint8_t b : v) id(lcd).write_byte(b); id(lcd).disable(); };
          id(backlight_pwm).set_level(0.0f);
          id(lcd_rst).turn_off(); delay(20);     // RST LOW  (데이터시트 최소 10µs)
          id(lcd_rst).turn_on();  delay(150);    // RST HIGH → 리셋 완료 대기 (최대 120ms)
          cmd(0x11); delay(120);                 // SLPOUT
          cmd(0x13);                             // NORON
          cmd(0x36); dat({0x08});                // MADCTL BGR
          cmd(0xB6); dat({0x0A, 0x82});          // (드라이버가 보내는 JLX240 데이터시트 값)
          cmd(0x3A); dat({0x55}); delay(10);     // COLMOD 16비트
          cmd(0xB2); dat({0x0C, 0x0C, 0x00, 0x33, 0x33});   // PORCTRL
          cmd(0xB7); dat({0x35});                // GCTRL
          cmd(0xBB); dat({0x28});                // VCOMS
          cmd(0xC0); dat({0x0C});                // LCMCTRL
          cmd(0xC2); dat({0x01, 0xFF});          // VDVVRHEN
          cmd(0xC3); dat({0x10});                // VRHS
          cmd(0xC4); dat({0x20});                // VDVS
          cmd(0xC6); dat({0x0F});                // FRCTRL2
          cmd(0xD0); dat({0xA4, 0xA1});          // PWCTRL1
          cmd(0xE0); dat({0xD0, 0x00, 0x02, 0x07, 0x0A, 0x28, 0x32, 0x44, 0x42, 0x06, 0x0E, 0x12, 0x14, 0x17});  // PVGAMCTRL
          cmd(0xE1); dat({0xD0, 0x00, 0x02, 0x07, 0x0A, 0x28, 0x31, 0x54, 0x47, 0x0E, 0x1C, 0x17, 0x1B, 0x1E});  // NVGAMCTRL
          cmd(0x21);                             // INVON
      - component.update: lcd                  # 표시 켜기 전에 프레임부터 채움 (쓰레기 화면 안 보이게)
      - lambda: |-
          id(lcd_dc).turn_off(); id(lcd).enable(); id(lcd).write_byte(0x29); id(lcd).disable(); id(lcd_dc).turn_on();   // DISPON
          id(backlight_pwm).set_level(id(display_brightness).state / 100.0f);
      - logger.log: {level: INFO, format: "LCD 하드 복구 완료"}

button:
  - platform: template
    name: "정상 종료"
    icon: mdi:power-cycle
    on_press: [script.execute: graceful_shutdown]
  - platform: restart
    id: restart_btn
    name: "컨트롤러 재시작"
  - platform: template
    name: "설정값 초기화"
    icon: mdi:backup-restore
    on_press: [script.execute: reset_settings]
  - platform: factory_reset
    id: factory_reset_btn
    name: "공장 초기화"        # WiFi·설정 전부 지우고 재부팅 → 다시 bc250-front-setup AP
  - platform: template
    name: "LCD 화면 복구"      # LCD 하드 리셋 + 초기화 다시 (화면이 깨진 채 안 돌아올 때) — 메뉴에도 있음. 한글만 쓰면 "정상 종료"와 ID가 겹쳐 ASCII 포함
    icon: mdi:monitor
    on_press: [script.execute: lcd_reset]

# ─── 로컬 설정값 (메뉴·웹·HA 어디서 바꿔도 플래시에 저장) ───
select:
  - platform: template
    id: fan_mode
    name: "팬 모드"
    options: ["자동", "수동"]
    initial_option: "자동"
    restore_value: true
    optimistic: true
  - platform: template
    id: fan_preset
    name: "팬 프리셋"
    options: ["조용히", "표준", "성능"]
    initial_option: "표준"
    restore_value: true
    optimistic: true

number:
  - platform: template
    id: manual_speed
    name: "수동 팬 속도"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
  - platform: template
    id: display_brightness
    name: "화면 밝기"
    min_value: 10
    max_value: 100
    step: 10
    initial_value: 80
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    on_value:
      - lambda: |-
          id(backlight_pwm).set_level(x / 100.0f);
          id(last_input) = millis();   // 웹/HA 에서 바꿔도 30초 동안은 자동 어둡게가 덮어쓰지 않게 (2026-09-01)
  - platform: template
    id: overheat_temp
    name: "과열 경고 온도 C"
    min_value: 70
    max_value: 95
    step: 5                 # 5°C 단위 (70·75·80·85·90·95) — 2026-08-31 1→5
    initial_value: 85
    restore_value: true
    optimistic: true
    unit_of_measurement: "°C"
  - platform: template
    id: shutdown_wait
    name: "종료 대기 시간 s"
    min_value: 30
    max_value: 180
    step: 15
    initial_value: 60
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"

# ─── 전원 제어 ───────────────────────────────
switch:
  - platform: gpio
    id: relay
    pin: GPIO4
    inverted: ${relay_inverted}   # 모듈=true / 캐리어 PCB=false (substitutions 참고)
    # 부팅 때 항상 릴레이 해제(=NC 접점 → PS_ON 접지 → 서버 ON). 마지막 "서버 꺼짐" 상태는 소프트 재부팅일 때만
    # esphome.on_boot(700)에서 되돌린다 → 전원을 뽑았다 꽂으면 무조건 서버 ON (2026-09-01, 예전 RESTORE_DEFAULT_OFF)
    restore_mode: ALWAYS_OFF

  - platform: template
    id: server_power
    name: "서버 전원"
    icon: mdi:server
    lambda: 'return !id(relay).state;'
    # 2026-09-07 버그 수정: 템플릿 스위치 기본값(RESTORE_DEFAULT_OFF)이 부팅 때 저장된 OFF 를 복원하며 turn_off_action 을
    # 실행 → 릴레이 ON(서버 꺼짐). 릴레이 ALWAYS_OFF·on_boot(700) 정책보다 먼저 돌아 "전원 투입 자동 부팅"이 무력화됐음
    # (로그: "Restored state OFF" 직후 "부팅 — 서버 ON" 이 찍히지만 실제론 꺼짐). 상태는 릴레이에서 오므로 복원 자체를 끈다.
    restore_mode: DISABLED
    turn_on_action:
      - if:
          condition: {binary_sensor.is_on: overheat_critical}   # 과열 위험이 아직 안 풀렸으면 켜기 거부 (2026-09-01)
          then:
            - logger.log: {level: ERROR, format: "과열 위험(GPU %.1f°C) — 전원 켜기 거부. 식은 뒤 다시", args: ['id(gpu_temp).state']}
          else:
            - switch.turn_off: relay
            - globals.set: {id: server_was_off, value: "false"}
            - globals.set: {id: shutdown_failed, value: "false"}
    turn_off_action:
      - script.stop: graceful_shutdown     # 강제 컷·웹 OFF 가 종료 대기 중이면 대기를 끊는다 (2026-09-01)
      - switch.turn_on: relay
      - globals.set: {id: server_was_off, value: "true"}
      - globals.set: {id: shutting_down, value: "false"}
      - globals.set: {id: shutdown_failed, value: "false"}

# ─── 입력 ───────────────────────────────────
binary_sensor:
  - platform: gpio
    id: power_button
    pin: {number: GPIO6, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 30ms]   # 긴 배선 노이즈·채터링으로 인한 오동작 방지
    on_press:
      - lambda: 'id(last_input) = millis();'
      - script.execute: lcd_heal_after_input
    on_release:
      - script.execute: lcd_heal_after_input
    on_multi_click:
      # 짧게: 꺼져 있으면 켬 / 켜져 있으면 ESP32가 직접 정상 종료 수행
      - timing: [ON for at most 1s]
        then:
          - if:
              condition: {switch.is_off: server_power}
              then: [switch.turn_on: server_power]
              else: [script.execute: graceful_shutdown]
          - component.update: lcd
      # 3초 이상 누르고 있으면 강제 전원 컷 (3초 되는 순간 실행 — 놓는 타이밍 맞출 필요 없음)
      - timing: [ON for at least 3s]
        then:
          - switch.turn_off: server_power
          - component.update: lcd

  # 메뉴 버튼 3개 (rotary 모드): A=다음 항목/값 올리기(+)  C=이전 항목/값 내리기(−)  B=선택·확정
  # 짧게(≤0.5초) 한 칸, 길게(≥0.6초) 누르고 있으면 0.2초마다 자동 반복.
  # 메뉴가 닫혀 있을 때: A=다음 화면(메인↔네트워크), C=이전 화면, B=메뉴 열기  (2026-08-31: 7초 자동 순환 제거)
  - platform: gpio          # 메뉴 버튼 A: 다음 항목 / 값 올리기(+)
    id: btn_next
    pin: {number: GPIO12, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 20ms]   # 채터링 제거
    on_click:
      min_length: 30ms
      max_length: 500ms
      then:
        - if:
            condition: {display_menu.is_active: settings_menu}
            then: [display_menu.down: settings_menu]
            else:
              - display.page.show_next: lcd
              - component.update: lcd
    on_press:
      - lambda: 'id(last_input) = millis();'
      - script.execute: menu_timeout
      - script.execute: lcd_heal_after_input
      - if:
          condition: {display_menu.is_active: settings_menu}
          then: [script.execute: hold_next]
    on_release:
      - script.stop: hold_next
      - script.execute: lcd_heal_after_input

  - platform: gpio          # 메뉴 버튼 C (2026-08-31 추가): 이전 항목 / 값 내리기(−)
    id: btn_prev
    pin: {number: GPIO14, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 20ms]
    on_click:
      min_length: 30ms
      max_length: 500ms
      then:
        - if:
            condition: {display_menu.is_active: settings_menu}
            then: [display_menu.up: settings_menu]
            else:
              - display.page.show_previous: lcd
              - component.update: lcd
    on_press:
      - lambda: 'id(last_input) = millis();'
      - script.execute: menu_timeout
      - script.execute: lcd_heal_after_input
      - if:
          condition: {display_menu.is_active: settings_menu}
          then: [script.execute: hold_prev]
    on_release:
      - script.stop: hold_prev
      - script.execute: lcd_heal_after_input

  - platform: gpio          # 메뉴 버튼 B: 선택·확정 (길게 1.2초 = 메뉴 닫기)
    id: btn_sel
    pin: {number: GPIO13, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 20ms]
    on_press:
      - lambda: 'id(last_input) = millis();'
      - script.execute: menu_timeout
      - script.execute: lcd_heal_after_input
    on_release:
      - script.execute: lcd_heal_after_input
    on_multi_click:
      - timing: [ON for at most 0.6s]
        then:
          - if:
              condition: {display_menu.is_active: settings_menu}
              then: [display_menu.enter: settings_menu]
              else: [display_menu.show: settings_menu]
      - timing: [ON for at least 1.2s]
        then: [display_menu.hide: settings_menu]

  - platform: template      # PWR_OK(회색) 10k+10k 분압 → GPIO5 를 ADC 로 읽어 판정 (2026-09-01, 예전엔 디지털 입력)
    id: psu_ok
    name: "PSU 실제 켜짐"
    device_class: power
    lambda: |-
      // 정상: 파워 켜짐 ≈ 2.5V / 꺼짐 ≈ 0V. 선이 안 물렸으면 대개 0~0.5V 를 떠돈다 → "PWR_OK 전압" 센서로 확인
      static bool on = false;
      float v = id(pwr_ok_v).state;
      if (isnan(v)) return on;
      if (v > 1.5f) on = true; else if (v < 1.0f) on = false;
      return on;

  - platform: template
    id: fan_error
    name: "팬 이상"
    device_class: problem
    lambda: |-
      return id(psu_ok).state && id(fan_pct).state > 20 && id(fan_rpm).state < 100;
    filters: [delayed_on: 30s]

  - platform: template
    id: overheat
    name: "과열"
    device_class: heat
    lambda: 'return id(gpu_temp).state > id(overheat_temp).state;'

  - platform: template        # 과열 경고 온도 + critical_margin 이 60초 지속 → 자동 종료
    id: overheat_critical
    name: "과열 위험"
    device_class: problem
    lambda: 'return !isnan(id(gpu_temp).state) && id(gpu_temp).state >= id(overheat_temp).state + ${critical_margin};'
    filters: [delayed_on: 60s]
    on_press:
      - if:
          condition: {switch.is_on: server_power}
          then: [script.execute: overheat_shutdown]

  - platform: template        # 릴레이는 켰는데 PSU PWR_OK 가 10초 넘게 안 옴 → PSU 고장·PS_ON/PWR_OK 배선 이상 (2026-09-01)
    id: psu_fault
    name: "PSU 이상"
    device_class: problem
    lambda: 'return id(server_power).state && !id(psu_ok).state;'
    filters: [delayed_on: 10s]
  - platform: template        # HA 자동화·대시보드용 상태 노출 (2026-09-01)
    id: shutting_down_bs
    name: "종료 진행 중"
    device_class: running
    lambda: 'return id(shutting_down);'
  - platform: template
    id: shutdown_failed_bs
    name: "정상 종료 실패"     # 한글만 5글자면 "과열 위험"과 ID 가 겹쳐 7글자로
    device_class: problem
    lambda: 'return id(shutdown_failed);'

# ─── 센서 ───────────────────────────────────
sensor:
  - platform: adc           # PWR_OK 분압 전압 (psu_ok 판정 근거 + 배선 확인용). ADC1 채널이라 WiFi 와 충돌 없음
    id: pwr_ok_v
    name: "PWR_OK 전압"
    pin: GPIO5
    attenuation: 12db       # 0~3.1V 범위
    samples: 8
    update_interval: 1s
    accuracy_decimals: 2
    unit_of_measurement: "V"
    filters: [delta: 0.05]  # 0.05V 이상 바뀔 때만 HA 로 전송
  - platform: dallas_temp
    id: gpu_temp
    name: "GPU 온도"
    address: 0xf200000022dcf928   # 2026-08-28 부팅 로그에서 읽은 실제 주소 (GPU/케이스 구분은 미확인 — 손으로 쥐어 확인, 반대면 아래와 맞바꿀 것)
    update_interval: 5s
  - platform: dallas_temp
    id: case_temp
    name: "케이스 온도"
    address: 0xd4000000c8df1728   # 2026-08-28 부팅 로그에서 읽은 실제 주소
    update_interval: 10s
  - platform: pulse_counter
    id: fan_rpm
    name: "팬 RPM"
    pin: {number: GPIO11, mode: {input: true, pullup: true}}
    unit_of_measurement: RPM
    filters: [multiply: 0.5]      # 2펄스/회전
    update_interval: 5s
  - platform: template
    id: fan_pct
    name: "팬 속도"
    unit_of_measurement: "%"
    lambda: 'return id(the_fan).state ? id(the_fan).speed : 0;'   # 팬 OFF(서버 꺼짐)면 0 (2026-09-01)
    update_interval: 5s
  - platform: uptime
    id: uptime_s
    name: "컨트롤러 업타임"
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi 신호"
    update_interval: 60s
  - platform: internal_temperature   # ESP32-S3 내부 온도 (2026-09-07) — 기판 발열이 정상 범위인지 확인용
    id: chip_temp
    name: "컨트롤러 칩 온도"
    entity_category: diagnostic
    update_interval: 30s
    filters: [delta: 0.5]

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: "IP 주소"

# ─── 팬 ─────────────────────────────────────
output:
  - platform: ledc
    id: fan_pwm_out
    pin: GPIO10
    frequency: 25000 Hz
    channel: 0              # 타이머 0 (채널 0·1 = 타이머 0, 2·3 = 타이머 1 …)
  - platform: ledc          # 디스플레이 백라이트 PWM
    id: backlight_pwm
    pin: GPIO18
    frequency: 5000 Hz
    channel: 2              # 2026-09-07: 예전엔 자동 배정으로 채널 1(=팬과 같은 타이머 0)이라 나중에 설정된 5kHz 가 팬 PWM(25kHz 규격)까지 덮어썼음
  - platform: gpio          # LCD RST 직접 제어 — 부팅 때 긴 하드 리셋용 (esphome.on_boot 참고) + 하드 복구(lcd_reset)
    id: lcd_rst
    pin: {number: GPIO16, allow_other_uses: true}   # display.reset_pin 과 공유
  - platform: gpio          # LCD DC(명령/데이터) 직접 제어 — 복구 스크립트(lcd_heal/lcd_reset)가 명령을 보낼 때
    id: lcd_dc
    pin: {number: GPIO15, allow_other_uses: true}   # display.dc_pin 과 공유 (드라이버는 매번 DC를 직접 세팅하므로 충돌 없음)

fan:
  - platform: speed
    id: the_fan
    name: "쿨링팬"
    output: fan_pwm_out

# 팬 커브: 40→20% 50→35% 60→50% 70→70% 80→100% (선형보간)
# 프리셋: 조용히 −10%p / 표준 0 / 성능 +15%p, 과열 임계값 이상이면 무조건 100%
interval:
  - interval: 60s           # LCD 소프트 복구 (2026-09-01) — 버튼 없이도 깨진 화면이 1분 안에 돌아오게
    then: [script.execute: lcd_heal]
  - interval: 5s
    then:
      # 백라이트: 기본은 설정 밝기. 서버 꺼짐 → ${off_brightness}%, 밤(${night_start}~${night_end}시, 시계 맞을 때만) → ${night_brightness}%.
      # 메뉴가 열려 있거나 버튼을 누른 지 30초 안이면 항상 설정 밝기.
      - lambda: |-
          float level = id(display_brightness).state / 100.0f;
          bool awake = id(settings_menu).is_active() || (millis() - id(last_input)) < 30000;
          if (!awake) {
            float cap = 1.0f;
            if (!id(server_power).state) {
              cap = ${off_brightness} / 100.0f;
            } else {
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                int h = now.hour;
                bool night = (${night_start} > ${night_end}) ? (h >= ${night_start} || h < ${night_end})
                                                             : (h >= ${night_start} && h < ${night_end});
                if (night) cap = ${night_brightness} / 100.0f;
              }
            }
            if (cap < level) level = cap;
          }
          id(backlight_pwm).set_level(level);
      - lambda: |-
          // 서버 꺼짐 = PSU 12V 없음 → 팬 엔티티 OFF (안 도는 팬이 도는 것처럼 안 보이게, 2026-09-01)
          if (!id(server_power).state) {
            if (id(the_fan).state) id(the_fan).turn_off().perform();
            return;
          }
          // fan_mode 옵션: 0=자동, 1=수동 (active_index는 버전 무관하게 동일 API)
          if (id(fan_mode).active_index().value_or(0) == 1) {
            int target = (int) id(manual_speed).state;
            if (!id(the_fan).state || id(the_fan).speed != target) {   // 바뀔 때만 (HA 로 5초마다 같은 값 안 보내게, 2026-09-01)
              auto call = id(the_fan).turn_on(); call.set_speed(target); call.perform();
            }
            return;
          }
          float t = id(gpu_temp).state;
          float pct;
          if (isnan(t)) {
            // 온도 센서 없음/고장: 팬이 꺼진 채 서버가 도는 일이 없도록 60% 고정 (2026-08-31)
            pct = 60;
          } else {
            if      (t >= id(overheat_temp).state) pct = 100;
            else if (t >= 80) pct = 100;
            else if (t >= 70) pct = 70  + (t-70)*3.0;
            else if (t >= 60) pct = 50  + (t-60)*2.0;
            else if (t >= 50) pct = 35  + (t-50)*1.5;
            else if (t >= 40) pct = 20  + (t-40)*1.5;
            else              pct = 20;
            // fan_preset 옵션: 0=조용히, 1=표준, 2=성능
            auto preset_idx = id(fan_preset).active_index().value_or(1);
            if (preset_idx == 0)      pct -= 10;
            else if (preset_idx == 2) pct += 15;
            if (pct < 10)  pct = 10;
            if (pct > 100) pct = 100;
          }
          int target = (int) pct;
          if (!id(the_fan).state || id(the_fan).speed != target) {     // 바뀔 때만 전송 (2026-09-01)
            auto call = id(the_fan).turn_on(); call.set_speed(target); call.perform();
          }
      # 상태 LED: 꺼짐=OFF / 종료중=노랑 / 이상(종료 실패·PSU 이상·팬 고장·과열)=빨강 / 정상=초록
      - lambda: |-
          auto call = id(status_led).turn_on();
          if (!id(server_power).state) { id(status_led).turn_off().perform(); return; }
          if (id(shutting_down)) call.set_rgb(1.0, 0.7, 0.0);
          else if (id(shutdown_failed) || id(psu_fault).state || id(fan_error).state || id(overheat).state) call.set_rgb(1.0, 0.0, 0.0);
          else call.set_rgb(0.0, 1.0, 0.0);
          call.set_brightness(0.4);
          call.perform();

# ─── 상태 LED ────────────────────────────────
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "상태 LED"
    pin: GPIO48
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB

# ─── 폰트 (240×320 화면에 맞춘 크기) ─────────
font:
  - file: "gfonts://Roboto@700"     # 대형 온도 표시
    id: f_48
    size: 48
    glyphs: '0123456789.-°C'
  - file: "gfonts://Roboto@700"     # 중형 값/제목
    id: f_28
    size: 28
    glyphs: '0123456789.-°%ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz :/'
  - file: "gfonts://Roboto@500"     # 소형 라벨/보조 값
    id: f_20
    size: 20
    glyphs: '0123456789.-°%ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz :/'
  - file: "gfonts://Roboto@500"     # 최소형 라벨(하단 아이콘)
    id: f_14
    size: 14
    glyphs: '0123456789.-°%ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz :/'
  - file: "gfonts://Noto Sans KR@500"   # 메뉴용 한글 폰트
    id: f_kr
    size: 22
    glyphs: ' abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.%<>()+-:/°팬모드수동프리셋화면밝기과열경고종료대시간컨트롤러재부팅닫자조용히표준성능값공만설소장정초취포함복구'

# ─── ST7789V 240×320 디스플레이 ──────────────
display:
  - platform: st7789v
    id: lcd
    model: custom
    height: 320
    width: 240
    offset_height: 0
    offset_width: 0
    cs_pin: GPIO17
    dc_pin: {number: GPIO15, allow_other_uses: true}      # output.lcd_dc 와 공유 (복구 스크립트용)
    reset_pin: {number: GPIO16, allow_other_uses: true}   # output.lcd_rst 와 공유 (부팅 때 긴 리셋·하드 복구)
    data_rate: ${lcd_data_rate}   # 기본 20MHz. 화면이 계속 깨지면 substitutions 에서 10MHz 로
    rotation: 0
    # 2026-09-01 1s → 2s: 한 프레임 쓰는 ~140ms 동안 루프가 멈추는 횟수를 절반으로. 버튼·전원 조작은 즉시 갱신됨
    update_interval: 2s
    pages:
      # ── 메인 화면: 전원 + 온도 + 팬 + 상태 아이콘 ──
      - id: pg_main
        lambda: |-
          // 상단 헤더 (배경 + 전원 상태 원형 아이콘 + 타이틀 + ON/OFF)
          it.filled_rectangle(0, 0, 240, 56, Color(26, 36, 52));
          if (!id(server_power).state) {
            it.filled_circle(24, 28, 11, Color(110, 110, 110));        // 꺼짐: 회색
          } else if (id(shutting_down)) {
            it.filled_circle(24, 28, 11, Color(255, 200, 0));          // 종료중: 노랑
          } else if (id(shutdown_failed) || id(psu_fault).state || id(fan_error).state || id(overheat).state) {
            it.filled_circle(24, 28, 11, Color(255, 60, 60));          // 이상: 빨강
          } else {
            it.filled_circle(24, 28, 11, Color(0, 220, 120));          // 정상: 초록
          }
          it.print(44, 12, id(f_28), Color(255, 255, 255), "BC250");
          it.print(158, 16, id(f_20),
                   id(server_power).state ? Color(0, 220, 120) : Color(150, 150, 150),
                   id(server_power).state ? "ON" : "OFF");

          // GPU 온도 (대형)
          it.print(18, 68, id(f_20), Color(150, 160, 180), "GPU TEMP");
          if (isnan(id(gpu_temp).state)) {
            it.print(18, 92, id(f_48), Color(255, 255, 255), "--");
          } else {
            it.printf(18, 92, id(f_48), Color(255, 255, 255), "%.1f\u00B0C", id(gpu_temp).state);
          }

          // 케이스 온도
          it.print(18, 152, id(f_20), Color(150, 160, 180), "CASE TEMP");
          if (isnan(id(case_temp).state)) {
            it.print(18, 176, id(f_28), Color(255, 255, 255), "--");
          } else {
            it.printf(18, 176, id(f_28), Color(255, 255, 255), "%.1f\u00B0C", id(case_temp).state);
          }

          // 팬 (2026-09-01): 서버 꺼짐 = 12V 없음 → OFF. 서버 켜짐인데 팬 이상(RPM 0)이면 RPM 빨강
          it.print(18, 214, id(f_20), Color(150, 160, 180), "FAN");
          if (!id(server_power).state) {
            it.print(18, 238, id(f_28), Color(150, 150, 150), "OFF");
            it.print(92, 246, id(f_14), Color(150, 150, 150), "NO 12V - PSU OFF");
          } else {
            it.printf(18, 238, id(f_28), id(fan_error).state ? Color(255, 60, 60) : Color(255, 255, 255),
                      "%.0f RPM", (float) id(fan_rpm).state);
            it.printf(150, 238, id(f_28), Color(255, 255, 255), "%.0f%%", (float) id(the_fan).speed);
          }

          // 하단 바 (2026-09-01): 종료 진행 / 종료 실패 / PSU 이상이면 메시지, 아니면 상태 아이콘 4개 (FAN / TEMP / PSU / NET)
          if (id(shutting_down)) {
            it.filled_rectangle(0, 272, 240, 48, Color(90, 70, 0));
            if (id(shutdown_deadline) == 0) {
              it.print(120, 296, id(f_20), Color(255, 220, 80), TextAlign::CENTER, "SENDING SHUTDOWN");
            } else {
              uint32_t now = millis();
              uint32_t left = id(shutdown_deadline) > now ? (id(shutdown_deadline) - now + 999) / 1000 : 0;
              it.printf(120, 296, id(f_20), Color(255, 220, 80), TextAlign::CENTER, "SHUTTING DOWN %us", (unsigned) left);
            }
          } else if (id(shutdown_failed)) {
            it.filled_rectangle(0, 272, 240, 48, Color(110, 20, 20));
            it.print(120, 285, id(f_14), Color(255, 140, 140), TextAlign::CENTER, "SHUTDOWN REQUEST FAILED");
            it.print(120, 305, id(f_14), Color(255, 255, 255), TextAlign::CENTER, "HOLD POWER 3S TO FORCE OFF");
          } else if (id(psu_fault).state) {
            it.filled_rectangle(0, 272, 240, 48, Color(110, 20, 20));
            it.print(120, 285, id(f_14), Color(255, 140, 140), TextAlign::CENTER, "PSU NOT OK");
            it.print(120, 305, id(f_14), Color(255, 255, 255), TextAlign::CENTER, "CHECK PS-ON RELAY / PWR-OK");
          } else {
            it.filled_rectangle(0, 272, 240, 48, Color(26, 36, 52));
            it.filled_circle(24, 296, 8, id(fan_error).state ? Color(255, 60, 60) : Color(0, 220, 120));     // 팬
            it.print(36, 288, id(f_14), Color(220, 220, 220), "FAN");
            it.filled_circle(80, 296, 8, id(overheat).state ? Color(255, 60, 60) : Color(0, 220, 120));      // 온도
            it.print(92, 288, id(f_14), Color(220, 220, 220), "TEMP");
            it.filled_circle(144, 296, 8, id(psu_ok).state ? Color(0, 220, 120) : Color(150, 150, 150));    // PSU PWR_OK (회색=꺼짐)
            it.print(156, 288, id(f_14), Color(220, 220, 220), "PSU");
            it.filled_circle(196, 296, 8,                                                                   // 네트워크
                             wifi::global_wifi_component->is_connected() ? Color(0, 220, 120) : Color(255, 200, 0));
            it.print(208, 288, id(f_14), Color(220, 220, 220), "NET");
          }

      # ── 네트워크 화면 ──
      - id: pg_net
        lambda: |-
          it.filled_rectangle(0, 0, 240, 320, Color(18, 24, 36));
          it.print(18, 16, id(f_28), Color(255, 255, 255), "Network");

          it.print(18, 70, id(f_20), Color(150, 160, 180), "WiFi");
          if (wifi::global_wifi_component->is_connected()) {
            it.print(18, 96, id(f_28), Color(0, 220, 120), "CONNECTED");
            it.print(18, 152, id(f_20), Color(150, 160, 180), "IP ADDRESS");
            it.print(18, 178, id(f_20), Color(255, 255, 255), id(ip_addr).state.empty() ? "--" : id(ip_addr).state.c_str());
            it.print(18, 226, id(f_20), Color(150, 160, 180), "SIGNAL");
            if (isnan(id(wifi_rssi).state)) {
              it.print(18, 252, id(f_20), Color(255, 255, 255), "--");
            } else {
              it.printf(18, 252, id(f_20), Color(255, 255, 255), "%d dBm", (int) id(wifi_rssi).state);
            }
          } else {
            // 오프라인 (2026-09-01): WiFi 실패 1분 뒤 설정용 AP 가 뜬다 — 비밀번호는 secrets.yaml 의 ap_password
            it.print(18, 96, id(f_28), Color(255, 200, 0), "OFFLINE");
            it.print(18, 152, id(f_20), Color(150, 160, 180), "SETUP AP AFTER 1 MIN");
            it.print(18, 178, id(f_20), Color(255, 255, 255), "bc250-front-setup");
            it.print(18, 226, id(f_20), Color(150, 160, 180), "SETUP PAGE");
            it.print(18, 252, id(f_20), Color(255, 255, 255), "192.168.4.1");
          }

# ─── 로컬 설정 메뉴 (버튼 3개로 조작: A 다음/+ · C 이전/− · B 선택) ───────────
graphical_display_menu:
  id: settings_menu
  display: lcd
  font: f_kr
  active: false
  mode: rotary
  on_redraw:
    then: [component.update: lcd]
  items:
    - type: select
      text: "팬 모드"
      select: fan_mode
    - type: number
      text: "수동 팬 %"
      format: "%.0f"
      number: manual_speed
    - type: select
      text: "팬 프리셋"
      select: fan_preset
    - type: number
      text: "화면 밝기"
      format: "%.0f"
      number: display_brightness
    - type: number
      text: "과열 경고 C"
      format: "%.0f"
      number: overheat_temp
    - type: number
      text: "종료 대기 s"
      format: "%.0f"
      number: shutdown_wait
    - type: command
      text: "화면 복구"          # LCD 하드 리셋 + 초기화 다시 (2026-09-01)
      on_value:
        then:
          - display_menu.hide: settings_menu
          - script.execute: lcd_reset
    - type: command
      text: "컨트롤러 재부팅"
      on_value:
        then: [button.press: restart_btn]
    - type: menu
      text: "초기화"
      items:
        - type: command
          text: "설정값만 초기화"
          on_value:
            then:
              - script.execute: reset_settings
              - display_menu.hide: settings_menu
        - type: command
          text: "공장 초기화(WiFi 포함)"
          on_value:
            then: [button.press: factory_reset_btn]
        - type: back
          text: "< 취소"
    - type: command
      text: "< 닫기"
      on_value:
        then: [display_menu.hide: settings_menu]
