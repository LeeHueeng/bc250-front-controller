# BC250 Front Controller — ESP32-S3 (풀옵션)
# 스펙 대비 조정된 부분:
#  - BC-250에는 전원 버튼이 없다 → 릴레이는 "버튼 누르기(300ms)"가 아니라
#    ATX PS_ON을 잡고 있는 유지(hold) 방식. NC 접점 배선이라 ESP 재부팅에도 서버 안 꺼짐.
#  - "정상 종료"는 ESP32가 주체: HTTP로 BC-250에 종료 명령 → 대기 → 전원 컷 (HA 불필요).
#
# 핀맵 (ESP32-S3):
#  GPIO4  릴레이 IN            GPIO9  I2C SCL (OLED)
#  GPIO5  PWR_OK 감지(분압)     GPIO10 팬 PWM 출력
#  GPIO6  전원 버튼(GND로)      GPIO11 팬 타코 입력
#  GPIO7  DS18B20 원와이어      GPIO12 메뉴 버튼A(이동, GND로)
#  GPIO8  I2C SDA (OLED)       GPIO13 메뉴 버튼B(선택, GND로)
#  GPIO48 WS2812 상태 LED (외장이면 핀 변경)
#
# 로컬 설정 메뉴 (OLED + 버튼 2개, 값은 플래시에 저장):
#  A 짧게: 아래 이동 / (메뉴 꺼져 있으면) 메뉴 열기     A 길게: 위 이동
#  B 짧게: 선택·편집 진입/확정                        B 길게: 메뉴 닫기

substitutions:
  # BC-250 OS 세팅 후 실제 IP·포트로 교체 (BC-250 쪽 shutdown 에이전트는 OS 설치 때 만듦)
  bc250_shutdown_url: "http://192.168.0.50:8420/shutdown"
  # 릴레이 구동 극성 — 시판 릴레이 모듈(옵토커플러, active-low)이면 "true",
  # 캐리어 PCB(hardware/bc250-front-carrier, NPN 직결 active-high)면 "false"
  relay_inverted: "true"
  # 로그 출력 UART — DevKitC-1(CH343 USB-시리얼)은 UART0,
  # PCBA 보드(hardware/bc250-front-pcba, 네이티브 USB-C)는 USB_SERIAL_JTAG
  log_uart: UART0

esphome:
  name: bc250-front
  friendly_name: BC250 컨트롤러

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: ${log_uart}   # DevKit=UART0 / PCBA=USB_SERIAL_JTAG (substitutions 참고)
api:            # HA 직결 (자동 발견·이벤트·서비스) — 없어도 동작에 지장 없음
  reboot_timeout: 0s
ota:
  platform: esphome
web_server:     # 웹 대시보드 — http://bc250-front.local
  version: 3

# MQTT가 꼭 필요하면 주석 해제 (HA만 쓸 거면 api로 충분)
# mqtt:
#   broker: !secret mqtt_broker

# WiFi 자격증명은 펌웨어에 없음 — 첫 부팅 시 ESP가 AP("bc250-front-setup")를 열고,
# 폰/노트북으로 접속하면 설정 페이지가 떠서 집 WiFi를 고르고 비번 입력 → 플래시에 저장.
wifi:
  reboot_timeout: 0s   # WiFi 끊겨도 재부팅 금지 — 로컬 제어(버튼·팬커브·OLED)는 계속 동작
  ap:
    ssid: "bc250-front-setup"   # 접속 실패 1분 후 자동으로 설정용 AP 다시 열림
captive_portal:
improv_serial:   # USB로도 설정 가능 (web.esphome.io)

i2c:
  sda: GPIO8
  scl: GPIO9

one_wire:
  - platform: gpio
    pin: GPIO7

globals:
  - id: shutting_down
    type: bool
    initial_value: "false"

http_request:
  timeout: 5s
  verify_ssl: false

# 정상 종료 시퀀스 — ESP32가 주체. HA 없이도 완결된다.
script:
  - id: graceful_shutdown
    mode: single
    then:
      - globals.set: {id: shutting_down, value: "true"}
      - http_request.post:
          url: ${bc250_shutdown_url}
      - delay: !lambda "return (uint32_t) id(shutdown_wait).state * 1000;"
      - switch.turn_off: server_power
      - globals.set: {id: shutting_down, value: "false"}

button:
  - platform: template
    name: "정상 종료"
    icon: mdi:power-cycle
    on_press: [script.execute: graceful_shutdown]
  - platform: restart
    id: restart_btn
    name: "컨트롤러 재시작"

# ─── 로컬 설정값 (메뉴·웹·HA 어디서 바꿔도 플래시에 저장) ───
select:
  - platform: template
    id: fan_mode
    name: "팬 모드"
    options: ["자동", "수동"]
    initial_option: "자동"
    restore_value: true
    optimistic: true
  - platform: template
    id: fan_preset
    name: "팬 프리셋"
    options: ["조용히", "표준", "성능"]
    initial_option: "표준"
    restore_value: true
    optimistic: true

number:
  - platform: template
    id: manual_speed
    name: "수동 팬 속도"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
  - platform: template
    id: oled_brightness
    name: "OLED 밝기"
    min_value: 10
    max_value: 100
    step: 10
    initial_value: 80
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    on_value:
      - lambda: 'id(oled).set_contrast(x / 100.0f);'
  - platform: template
    id: overheat_temp
    name: "과열 경고 온도 C"
    min_value: 70
    max_value: 95
    step: 1
    initial_value: 85
    restore_value: true
    optimistic: true
    unit_of_measurement: "°C"
  - platform: template
    id: shutdown_wait
    name: "종료 대기 시간 s"
    min_value: 30
    max_value: 180
    step: 15
    initial_value: 60
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"

# ─── 전원 제어 ───────────────────────────────
switch:
  - platform: gpio
    id: relay
    pin: GPIO4
    inverted: ${relay_inverted}   # 모듈=true / 캐리어 PCB=false (substitutions 참고)
    restore_mode: RESTORE_DEFAULT_OFF  # 재부팅해도 마지막 전원 상태 유지 (기본=서버 ON)

  - platform: template
    id: server_power
    name: "서버 전원"
    icon: mdi:server
    lambda: 'return !id(relay).state;'
    turn_on_action:  [switch.turn_off: relay]
    turn_off_action: [switch.turn_on: relay]

# ─── 입력 ───────────────────────────────────
binary_sensor:
  - platform: gpio
    id: power_button
    pin: {number: GPIO6, mode: {input: true, pullup: true}, inverted: true}
    on_multi_click:
      # 짧게: 꺼져 있으면 켬 / 켜져 있으면 ESP32가 직접 정상 종료 수행
      - timing: [ON for at most 1s]
        then:
          - if:
              condition: {switch.is_off: server_power}
              then: [switch.turn_on: server_power]
              else: [script.execute: graceful_shutdown]
      # 5초 이상: 강제 전원 컷
      - timing: [ON for at least 5s]
        then: [switch.turn_off: server_power]

  - platform: gpio          # 메뉴 버튼 A: 이동
    id: btn_nav
    pin: {number: GPIO12, mode: {input: true, pullup: true}, inverted: true}
    on_multi_click:
      - timing: [ON for at most 0.6s]
        then:
          - if:
              condition: {display_menu.is_active: settings_menu}
              then: [display_menu.down: settings_menu]
              else: [display_menu.show: settings_menu]
      - timing: [ON for at least 0.8s]
        then:
          - if:
              condition: {display_menu.is_active: settings_menu}
              then: [display_menu.up: settings_menu]

  - platform: gpio          # 메뉴 버튼 B: 선택
    id: btn_sel
    pin: {number: GPIO13, mode: {input: true, pullup: true}, inverted: true}
    on_multi_click:
      - timing: [ON for at most 0.6s]
        then:
          - if:
              condition: {display_menu.is_active: settings_menu}
              then: [display_menu.enter: settings_menu]
              else: [display_menu.show: settings_menu]
      - timing: [ON for at least 1.2s]
        then: [display_menu.hide: settings_menu]

  - platform: gpio
    id: psu_ok
    name: "PSU 실제 켜짐"
    pin: {number: GPIO5, mode: INPUT}   # PWR_OK(회색) 10k+10k 분압
    device_class: power

  - platform: template
    id: fan_error
    name: "팬 이상"
    device_class: problem
    lambda: |-
      return id(psu_ok).state && id(fan_pct).state > 20 && id(fan_rpm).state < 100;
    filters: [delayed_on: 30s]

  - platform: template
    id: overheat
    name: "과열"
    device_class: heat
    lambda: 'return id(gpu_temp).state > id(overheat_temp).state;'

# ─── 센서 ───────────────────────────────────
sensor:
  - platform: dallas_temp
    id: gpu_temp
    name: "GPU 온도"
    address: 0xf200000022dcf928   # 2026-08-28 부팅 로그에서 읽은 실제 주소 (GPU/케이스 구분은 미확인 — 손으로 쥐어 확인, 반대면 아래와 맞바꿀 것)
    update_interval: 5s
  - platform: dallas_temp
    id: case_temp
    name: "케이스 온도"
    address: 0xd4000000c8df1728   # 2026-08-28 부팅 로그에서 읽은 실제 주소
    update_interval: 10s
  - platform: pulse_counter
    id: fan_rpm
    name: "팬 RPM"
    pin: {number: GPIO11, mode: {input: true, pullup: true}}
    unit_of_measurement: RPM
    filters: [multiply: 0.5]      # 2펄스/회전
    update_interval: 5s
  - platform: template
    id: fan_pct
    name: "팬 속도"
    unit_of_measurement: "%"
    lambda: 'return id(the_fan).speed;'
    update_interval: 5s
  - platform: uptime
    name: "컨트롤러 업타임"
  - platform: wifi_signal
    name: "WiFi 신호"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: "IP 주소"

# ─── 팬 ─────────────────────────────────────
output:
  - platform: ledc
    id: fan_pwm_out
    pin: GPIO10
    frequency: 25000 Hz

fan:
  - platform: speed
    id: the_fan
    name: "쿨링팬"
    output: fan_pwm_out

# 팬 커브: 40→20% 50→35% 60→50% 70→70% 80→100% (선형보간)
# 프리셋: 조용히 −10%p / 표준 0 / 성능 +15%p, 과열 임계값 이상이면 무조건 100%
interval:
  - interval: 5s
    then:
      - lambda: |-
          if (id(fan_mode).current_option().str() == "수동") {
            auto call = id(the_fan).turn_on();
            call.set_speed((int) id(manual_speed).state);
            call.perform();
            return;
          }
          float t = id(gpu_temp).state;
          if (isnan(t)) return;
          float pct;
          if      (t >= id(overheat_temp).state) pct = 100;
          else if (t >= 80) pct = 100;
          else if (t >= 70) pct = 70  + (t-70)*3.0;
          else if (t >= 60) pct = 50  + (t-60)*2.0;
          else if (t >= 50) pct = 35  + (t-50)*1.5;
          else if (t >= 40) pct = 20  + (t-40)*1.5;
          else              pct = 20;
          if (id(fan_preset).current_option().str() == "조용히")      pct -= 10;
          else if (id(fan_preset).current_option().str() == "성능")   pct += 15;
          if (pct < 10)  pct = 10;
          if (pct > 100) pct = 100;
          auto call = id(the_fan).turn_on();
          call.set_speed((int)pct);
          call.perform();
      # 상태 LED: 꺼짐=OFF / 종료중=노랑 / 이상=빨강 / 정상=초록
      - lambda: |-
          auto call = id(status_led).turn_on();
          if (!id(server_power).state) { id(status_led).turn_off().perform(); return; }
          if (id(shutting_down)) call.set_rgb(1.0, 0.7, 0.0);
          else if (id(fan_error).state || id(overheat).state) call.set_rgb(1.0, 0.0, 0.0);
          else call.set_rgb(0.0, 1.0, 0.0);
          call.set_brightness(0.4);
          call.perform();
  - interval: 7s
    then:
      - if:
          condition: {display_menu.is_active: settings_menu}
          then: []   # 메뉴 사용 중엔 화면 자동 순환 정지
          else:
            - display.page.show_next: oled
            - component.update: oled

# ─── 상태 LED ────────────────────────────────
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "상태 LED"
    pin: GPIO48
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB

# ─── OLED ───────────────────────────────────
font:
  - file: "gfonts://Roboto@500"
    id: f1
    size: 12
  - file: "gfonts://Roboto@700"
    id: f2
    size: 16
  - file: "gfonts://Noto Sans KR@500"   # 메뉴용 한글 폰트 (쓰는 글자만 포함)
    id: f_kr
    size: 12
    glyphs: " abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.%<>+-:/°팬모드수동프리셋밝기과열경고종료대시간컨트롤러재부팅닫자조용히표준성능"

display:
  - platform: ssd1306_i2c
    id: oled
    model: SSD1306 128x64
    pages:
      - id: pg_main
        lambda: |-
          it.printf(0, 0, id(f2), "BC250 %s", id(server_power).state ? "ON" : "OFF");
          it.printf(0, 20, id(f1), "GPU %.1f\xC2\xB0  CASE %.1f\xC2\xB0", id(gpu_temp).state, id(case_temp).state);
          it.printf(0, 36, id(f1), "FAN %.0f%%  %.0f RPM", id(the_fan).speed * 1.0, id(fan_rpm).state);
          if (id(fan_error).state) it.print(0, 52, id(f1), "!! FAN FAILURE");
          else if (id(overheat).state) it.print(0, 52, id(f1), "!! OVERHEAT");
      - id: pg_net
        lambda: |-
          it.print(0, 0, id(f2), "Network");
          it.printf(0, 20, id(f1), "WiFi %s", wifi::global_wifi_component->is_connected() ? "OK" : "...");
          it.printf(0, 36, id(f1), "%s", id(ip_addr).state.c_str());

# ─── 로컬 설정 메뉴 (버튼 2개로 조작) ───────────
graphical_display_menu:
  id: settings_menu
  display: oled
  font: f_kr
  active: false
  mode: rotary
  on_redraw:
    then: [component.update: oled]
  items:
    - type: select
      text: "팬 모드"
      select: fan_mode
    - type: number
      text: "수동 팬 %"
      number: manual_speed
    - type: select
      text: "팬 프리셋"
      select: fan_preset
    - type: number
      text: "OLED 밝기"
      number: oled_brightness
    - type: number
      text: "과열 경고 C"
      number: overheat_temp
    - type: number
      text: "종료 대기 s"
      number: shutdown_wait
    - type: command
      text: "컨트롤러 재부팅"
      on_value:
        then: [button.press: restart_btn]
    - type: command
      text: "< 닫기"
      on_value:
        then: [display_menu.hide: settings_menu]
